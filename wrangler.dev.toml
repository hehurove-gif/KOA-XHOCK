# Solo desarrollo local (npm run db:migrate:local, npm run dev:worker, npm run test:e2e). No se despliega.
name = "koa-xhock"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "_site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/_v/*", "/", "/index.html", "/tickets", "/tickets.html"]

[[d1_databases]]
binding = "DB"
database_name = "koa-xhock"
database_id = "koa-xhock"
migrations_dir = "migrations"

[vars]
TERMS_VERSION = "draft-2026-11"

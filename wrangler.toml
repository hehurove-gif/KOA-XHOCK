# Worker con Static Assets (sitio + API + D1). Se despliega con `npx wrangler deploy` (Workers Builds).
# Documentación: https://developers.cloudflare.com/workers/static-assets/
name = "koa-xhock"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# Sitio estático (Eleventy) + API en el mismo Worker. Solo /api/* pasa primero por el código.
[assets]
directory = "_site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/_v/*", "/", "/index.html", "/tickets", "/tickets.html"]

# Base de datos de registros (D1). Está COMENTADA a propósito: con un database_id falso, el despliegue en
# Cloudflare falla ("Invalid database UUID"). Cuando exista la base real:
#   1) npx wrangler d1 create koa-xhock        (imprime el database_id)
#   2) descomentar este bloque y pegar el id
#   3) npm run db:migrate:remote
# Para desarrollo local se usa wrangler.dev.toml (no se despliega).
# [[d1_databases]]
# binding = "DB"
# database_name = "koa-xhock"
# database_id = "PEGAR-AQUI-EL-ID-REAL"
# migrations_dir = "migrations"

# Variables no secretas (los secretos —llaves de Stripe, tokens— se cargan en el panel de Cloudflare (Settings → Variables and Secrets, tipo Secret),
# nunca en este archivo). Ver 02-despliegue/CHECKOUT_STRIPE_D1.md.
[vars]
TERMS_VERSION = "draft-2026-11"

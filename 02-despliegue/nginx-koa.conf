# =============================================================================
# KOA · XHOCK — configuración de referencia para nginx
# -----------------------------------------------------------------------------
# Ruta sugerida: /etc/nginx/sites-available/koa-hub.conf
# Activar con:   ln -s /etc/nginx/sites-available/koa-hub.conf \
#                    /etc/nginx/sites-enabled/koa-hub.conf
# Validar con:   nginx -t && systemctl reload nginx
#
# Supuestos:
#   - El dominio koa-hub.com ya apunta al servidor y tiene certificado TLS.
#   - El sitio de tickets vive en /var/www/koa-hub/tickets/.
#   - robots.txt se publica en la raíz del dominio (/var/www/koa-hub/).
#   - PHP-FPM 8.2 escucha en /run/php/php8.2-fpm.sock (ajustar versión).
#   - Los archivos del sitio (raíz del paquete) se copian a /var/www/koa-hub/tickets/.
#
# IMPORTANTE: este archivo es una plantilla. Revisar rutas, versión de PHP y
# certificados antes de aplicarlo. No contiene secretos.
# =============================================================================

# --- Contexto http (añadir en /etc/nginx/nginx.conf, dentro de http { }) -----
# Limita los intentos de creación de pedidos. Ajustar el rate según el tráfico.
# limit_req_zone $binary_remote_addr zone=koa_checkout:10m rate=10r/m;

# --- Redirección de HTTP a HTTPS ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name koa-hub.com www.koa-hub.com;

    # Para renovar Let's Encrypt sin redirección:
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://koa-hub.com$request_uri;
    }
}

# --- Sitio principal ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1: http2 on;
    # nginx <  1.25.1: usar "listen 443 ssl http2;" y borrar la línea de abajo.
    http2 on;

    server_name koa-hub.com www.koa-hub.com;

    root /var/www/koa-hub;
    index index.html;

    # Certificados (ajustar a la ruta real; p. ej. Certbot).
    ssl_certificate     /etc/letsencrypt/live/koa-hub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koa-hub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de seguridad. Se repiten en las location que usan add_header
    # porque nginx no hereda add_header cuando la location define uno propio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # HSTS solo si TODO el dominio y subdominios usan HTTPS. Si no, comentar.

    # CSP: probar primero en Report-Only durante 1-2 semanas. La página usa
    # un script inline mínimo (clase .js) y estilos inline heredados; por eso
    # se permite 'unsafe-inline' en esta primera fase. Endurecer después.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https://www.facebook.com https://www.googletagmanager.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://connect.facebook.net; frame-src https://www.googletagmanager.com; form-action 'self' https://checkout.stripe.com" always;

    client_max_body_size 2m;
    server_tokens off;

    # --- Compresión -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/rss+xml image/svg+xml;

    # Brotli: solo si el módulo está instalado (nginx-mod-brotli / ngx_brotli).
    # Comprobar con: nginx -V 2>&1 | tr ' ' '\n' | grep brotli
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css text/xml application/json
    #              application/javascript application/xml image/svg+xml;

    # --- Redirección de la ruta sin barra final ------------------------------
    location = /tickets {
        return 301 /tickets/;
    }

    # --- Página de tickets y documentos legales ------------------------------
    # try_files SIN fallback a index.html: un recurso inexistente debe dar 404,
    # no devolver el HTML de la página (hallazgo N-01 del informe).
    location /tickets/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- Estáticos: caché larga ----------------------------------------------
    # Los nombres de imagen no llevan hash de contenido: 30 días es seguro y
    # suficiente. CSS/JS se sirven con 7 días; al desplegar, purgar caché o
    # añadir ?v=AAAA-MM-DD en index.html para forzar la actualización.
    location ~* ^/tickets/assets/.*\.(?:css|js|woff2|webp|png|jpe?g|svg|ico)$ {
        expires off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    location ~* ^/tickets/.*\.(?:css|js)$ {
        expires off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- API de checkout (PHP) ------------------------------------------------
    # El endpoint debe aceptar solo POST y responder 405 en GET/HEAD. Esa
    # comprobación se hace en PHP para devolver JSON; no se bloquea en nginx
    # para no convertir el 405 en un 403 genérico.
    location = /tickets/api/checkout.php {
        # Activar tras definir la zona en el contexto http:
        # limit_req zone=koa_checkout burst=5 nodelay;
        # limit_req_status 429;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Ningún otro .php debe ejecutarse ni descargarse como texto.
    location ~ \.php$ {
        return 404;
    }

    # --- robots.txt y sitemap -------------------------------------------------
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }
    # El sitemap vive en /tickets/sitemap.xml y lo sirve la location /tickets/.

    # --- Protección de archivos sensibles ------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(?:bak|conf|dist|env|ini|log|sql|swp|tar|gz|zip)$ {
        deny all;
    }

    # --- 404 propio (opcional) ------------------------------------------------
    # error_page 404 /tickets/404.html;
    # location = /tickets/404.html { internal; }

    access_log /var/log/nginx/koa-hub.access.log;
    error_log  /var/log/nginx/koa-hub.error.log warn;
}
